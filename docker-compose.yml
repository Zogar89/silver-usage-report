services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.example
    ports:
      - "8002:8000"
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: silver_usage_report
      POSTGRES_USER: silver
      POSTGRES_PASSWORD: silver
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
