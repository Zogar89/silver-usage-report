[project]
name = "silver-usage-report"
version = "0.1.0"
description = "Open source intake flow for reporting aggregate AI token usage to Silver."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.17.0",
  "fastapi>=0.124.0",
  "jinja2>=3.1.6",
  "psycopg[binary]>=3.3.2",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.12.0",
  "sqlalchemy>=2.0.45",
  "uvicorn[standard]>=0.38.0",
]

[project.scripts]
silver-usage-report = "cli.main:main"
silver-usage-collector = "cli.main:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.0.0",
  "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "cli*"]
exclude = ["tests*", "docs*", "packaging*"]

[tool.setuptools.package-data]
app = ["data/*.json"]
